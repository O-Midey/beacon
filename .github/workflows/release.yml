name: Release

# Publishes to npm with provenance: a signed, verifiable link between the
# tarball on the registry and the exact commit and workflow run that produced
# it. Beacon installs a git hook, reads private diffs, and holds an API key —
# users deserve to check that what they install is what is in this repository.
#
# Requires:
#   - `id-token: write`, so the runner can mint the OIDC token Sigstore signs.
#   - A `repository` field in package.json (npm refuses provenance without it).
#   - An npm **Automation** access token in the NPM_TOKEN repository secret.
#   - A public repository.
#
# Third-party actions are pinned by commit SHA, not tag: a tag is mutable and a
# compromised upstream could retag it at any point in this workflow's life.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full pipeline but pass --dry-run to npm publish (no registry write)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Consider binding this job to a protected GitHub Environment with required
    # reviewers once one exists, so a publish cannot happen unattended.

    permissions:
      contents: read
      id-token: write # required for provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a git ref that does not describe it. Fail before that lands
      # on the registry, where it cannot be taken back.
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `prepublishOnly` re-runs typecheck, test, and build. That is deliberate
      # redundancy: it also protects a publish run from a developer's laptop.
      #
      # `inputs.dry_run` is only ever set on a manual `workflow_dispatch`; on a
      # `release: published` event it is empty, so a real release always
      # publishes for real. `--dry-run` builds and packs but never contacts the
      # registry, so it does NOT exercise token auth or provenance signing —
      # only a real publish does. It exists to prove the workflow itself runs
      # green in CI before a release event depends on it.
      - name: Publish with provenance
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-extension:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    # Independent of the npm job: a different artifact and Marketplace, versioned
    # separately (extension/package.json). If VSCE_PAT is unset the job packages
    # the VSIX and stops — a release never fails because the extension has no
    # token configured yet.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # The extension packages the built UI bundle, so build it from the repo
      # root first; `vscode:prepublish` then copies dist/ui into the VSIX.
      - name: Install root dependencies
        run: npm ci

      - name: Build UI bundle
        run: npm run build

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Package or publish the extension
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — packaging the VSIX only, skipping Marketplace publish."
            npm run package
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — packaging the VSIX without publishing."
            npm run package
          else
            npm run publish
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beacon-review-vsix
          path: extension/*.vsix
          if-no-files-found: warn
